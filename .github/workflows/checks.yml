name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.27"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked python -B -m unittest discover -s tests -v
      - run: uv run --locked python -B -c "from utils import load_questions; print(len(load_questions()), 'valid questions')"
      - run: docker compose config --quiet
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Check local health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
